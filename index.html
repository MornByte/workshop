<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日心情墙 · Mood Wall</title>

  <style>
    /* ===== 今日心情墙：温暖日落主题 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      /* 桃粉→珊瑚→淡粉的日落渐变，温柔治愈 */
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 35%, #ff9a9e 65%, #fad0c4 100%);
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #5a4a42;
      padding: 32px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* 两个柔光圆斑：一个金色（朝阳）一个粉色（晚霞） */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 400px; height: 400px;
      background: #ffd86b;
      top: -120px; left: -80px;
    }
    body::after {
      width: 380px; height: 380px;
      background: #ff8fab;
      bottom: -120px; right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ===== 标题 ===== */
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 {
      font-size: 34px;
      letter-spacing: 5px;
      color: #c85a6a;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.6);
    }
    .header p {
      margin-top: 10px;
      color: #9a6b5e;
      font-size: 14px;
      letter-spacing: 2px;
    }

    /* ===== 玻璃拟态卡片（奶白色半透明） ===== */
    .card {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 35px rgba(200, 90, 106, 0.2);
      margin-bottom: 24px;
    }

    /* ===== 表单 ===== */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #a05a52;
      font-weight: bold;
    }
    .field input,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(200, 90, 106, 0.25);
      background: rgba(255, 255, 255, 0.7);
      color: #5a4a42;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus,
    .field textarea:focus {
      border-color: #ff8fab;
      box-shadow: 0 0 0 3px rgba(255, 143, 171, 0.25);
    }
    .field textarea { resize: vertical; min-height: 90px; }
    .field input::placeholder,
    .field textarea::placeholder { color: #c4a89e; }

    /* ===== 心情指数选择器 ===== */
    .mood-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
    }
    .mood-btn {
      flex: 1;
      padding: 10px 0;
      border: 2px solid transparent;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.6);
      font-size: 26px;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1;
    }
    .mood-btn:hover {
      transform: translateY(-3px) scale(1.1);
    }
    /* 选中的心情按钮：高亮+上浮 */
    .mood-btn.active {
      border-color: #ff8fab;
      background: rgba(255, 143, 171, 0.25);
      transform: translateY(-3px) scale(1.1);
      box-shadow: 0 6px 16px rgba(255, 143, 171, 0.4);
    }
    .mood-label {
      font-size: 11px;
      color: #a05a52;
      text-align: center;
      margin-top: 6px;
    }

    /* 提交按钮：粉橙渐变 */
    .submit-btn {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      letter-spacing: 4px;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
      box-shadow: 0 6px 20px rgba(255, 154, 158, 0.45);
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 154, 158, 0.6);
    }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 错误提示条 */
    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #e11d48;
    }
    .alert.show { display: block; }

    /* ===== 留言列表 ===== */
    .section-title {
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a05a52;
    }
    .section-title .count {
      font-size: 13px;
      color: #c85a6a;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      padding: 2px 12px;
    }

    .message-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 单条心情卡片 */
    .message-item {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      animation: fadeInUp 0.4s ease both;
    }
    /* 左侧大心情表情 */
    .mood-face {
      font-size: 40px;
      line-height: 1;
      flex-shrink: 0;
      width: 52px;
      text-align: center;
    }
    .mood-body { flex: 1; min-width: 0; }
    .message-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .message-nickname {
      font-weight: bold;
      color: #c85a6a;
      font-size: 15px;
    }
    .message-id { font-size: 12px; color: #b08a7e; }
    .message-content {
      font-size: 15px;
      line-height: 1.7;
      color: #5a4a42;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* 不同心情给卡片左侧加一条色带，一眼区分情绪 */
    .mood-1 { border-left: 5px solid #7eb8ff; }   /* 难过：蓝 */
    .mood-2 { border-left: 5px solid #b794f4; }   /* 低落：紫 */
    .mood-3 { border-left: 5px solid #cbd5e0; }   /* 平静：灰 */
    .mood-4 { border-left: 5px solid #68d391; }   /* 不错：绿 */
    .mood-5 { border-left: 5px solid #ffd86b; }   /* 开心：金 */

    .tip {
      text-align: center;
      color: #b08a7e;
      font-size: 14px;
      padding: 24px 0;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 26px; }
      .card { padding: 18px; }
      .mood-face { font-size: 32px; width: 42px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 标题 -->
    <div class="header">
      <h1>☀ 今日心情墙</h1>
      <p>记录此刻的心情，让情绪有处安放</p>
    </div>

    <!-- 发布心情表单 -->
    <div class="card">
      <div id="errorBox" class="alert"></div>

      <form id="messageForm">
        <div class="field">
          <label for="nickname">昵称</label>
          <input type="text" id="nickname" placeholder="给自己起个名字吧～" maxlength="20" required />
        </div>

        <div class="field">
          <label>今天心情如何？</label>
          <!-- 5 个心情按钮，data-mood 记录 1-5 的分值 -->
          <div class="mood-row" id="moodRow">
            <button type="button" class="mood-btn" data-mood="1" title="难过">😢</button>
            <button type="button" class="mood-btn" data-mood="2" title="低落">😟</button>
            <button type="button" class="mood-btn active" data-mood="3" title="平静">😐</button>
            <button type="button" class="mood-btn" data-mood="4" title="不错">🙂</button>
            <button type="button" class="mood-btn" data-mood="5" title="开心">😄</button>
          </div>
          <div class="mood-label">点击一个表情，代表你现在的心情</div>
        </div>

        <div class="field">
          <label for="content">想说点什么</label>
          <textarea id="content" placeholder="写下此刻的心情吧～" maxlength="500" required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">发布心情</button>
      </form>
    </div>

    <!-- 心情列表 -->
    <div class="card">
      <div class="section-title">
        <span>� 大家的心情</span>
        <span class="count" id="msgCount">0</span>
      </div>
      <ul class="message-list" id="messageList">
        <li class="tip">正在加载心情…</li>
      </ul>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8000/api/messages";

    // 心情表情对照表：分值 → emoji
    const MOOD_FACES = { 1: "😢", 2: "😟", 3: "😐", 4: "🙂", 5: "😄" };

    const form = document.getElementById("messageForm");
    const nicknameInput = document.getElementById("nickname");
    const contentInput = document.getElementById("content");
    const submitBtn = document.getElementById("submitBtn");
    const messageList = document.getElementById("messageList");
    const msgCount = document.getElementById("msgCount");
    const errorBox = document.getElementById("errorBox");
    const moodRow = document.getElementById("moodRow");

    // 当前选中的心情分值，默认 3（平静）
    let selectedMood = 3;

    /* ========== 心情选择按钮的交互 ========== */
    moodRow.addEventListener("click", function (e) {
      // 只处理点在心情按钮上的情况
      const btn = e.target.closest(".mood-btn");
      if (!btn) return;
      // 先把所有按钮的 active 去掉，再给当前点的加上
      moodRow.querySelectorAll(".mood-btn").forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      // 把按钮上 data-mood 的值（字符串）转成数字存起来
      selectedMood = Number(btn.dataset.mood);
    });

    /* ========== 错误提示 ========== */
    function showError(text) {
      errorBox.textContent = text;
      errorBox.classList.add("show");
    }
    function hideError() {
      errorBox.classList.remove("show");
    }

    /* ========== 渲染列表 ========== */
    function renderMessages(messages) {
      messageList.innerHTML = "";
      msgCount.textContent = messages.length;

      if (messages.length === 0) {
        const tip = document.createElement("li");
        tip.className = "tip";
        tip.textContent = "还没有人分享心情，来做第一个吧 ☁";
        messageList.appendChild(tip);
        return;
      }

      messages.forEach(function (msg) {
        // 后端返回的每条留言自带 mood 字段，直接用
        const mood = msg.mood || 3;

        const item = document.createElement("li");
        // 根据心情加 mood-1~5 的类，控制左侧色带颜色
        item.className = "message-item mood-" + mood;

        // 左侧大表情
        const face = document.createElement("div");
        face.className = "mood-face";
        face.textContent = MOOD_FACES[mood];

        // 右侧：昵称 + 内容
        const body = document.createElement("div");
        body.className = "mood-body";

        const head = document.createElement("div");
        head.className = "message-head";

        const nickname = document.createElement("span");
        nickname.className = "message-nickname";
        nickname.textContent = msg.nickname;

        const id = document.createElement("span");
        id.className = "message-id";
        id.textContent = "#" + msg.id;

        head.appendChild(nickname);
        head.appendChild(id);

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = msg.content;

        body.appendChild(head);
        body.appendChild(content);

        item.appendChild(face);
        item.appendChild(body);
        messageList.appendChild(item);
      });
    }

    /* ========== 加载留言 ========== */
    async function loadMessages() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("服务器错误：" + res.status);
        const data = await res.json();
        hideError();
        renderMessages(data);
      } catch (err) {
        messageList.innerHTML = "";
        msgCount.textContent = "0";
        const tip = document.createElement("li");
        tip.className = "tip";
        tip.textContent = "心情加载失败";
        messageList.appendChild(tip);
        showError("无法连接后端，请确认已运行：uvicorn main:app --reload");
      }
    }

    /* ========== 提交表单 ========== */
    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      hideError();

      const nickname = nicknameInput.value.trim();
      const content = contentInput.value.trim();

      if (!nickname || !content) {
        showError("昵称和内容都不能为空哦");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "发布中…";

      try {
        // 把心情一起发给后端
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nickname: nickname,
            content: content,
            mood: selectedMood,
          }),
        });

        if (!res.ok) throw new Error("提交失败：" + res.status);

        // 清空输入框，心情保持当前选择（方便连续发）
        nicknameInput.value = "";
        contentInput.value = "";

        await loadMessages();
      } catch (err) {
        showError("发布失败，请确认后端服务已启动");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "发布心情";
      }
    });

    // 页面打开时加载已有留言
    loadMessages();
  </script>
</body>
</html>
